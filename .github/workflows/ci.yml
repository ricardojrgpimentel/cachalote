name: CI

# Não há testes que precisem de telemóvel aqui: o que se verifica no CI é exactamente aquilo
# que se pode verificar sem dispositivo — e que já falhou em silêncio uma vez (ver §21 do
# STATUS: um `{}` sem `type` no schema do plugin desligou as sete ferramentas android_* sem
# que nenhum teste de UI se queixasse).

on:
  # Só ramos: uma tag de release (ex.: `kernel-…`) aponta para o commit que empacotou o kernel e
  # não deve disparar a CI — chegou a correr sobre um commit anterior a uma correcção e deu um
  # vermelho que não dizia nada sobre o estado actual do código (ver STATUS §49).
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  plugin-schema:
    name: schema do plugin (regressão §21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # O plugin compila contra o `dsh-tools` do kernel a sério; buscamo-lo à mesma versão
      # que o tools/bootstrap.sh usa por omissão.
      - name: Obter o kernel do npm
        run: |
          mkdir -p .work/dsh-install
          npm install --silent --no-audit --no-fund \
            --prefix .work/dsh-install "@deepseek-ai/dsh@0.2.0-rc.2"

      - name: Regressão do schema do plugin
        run: ./tools/plugin-schema-test.sh

      # Os patches são substituições de texto: se a versão do kernel mudar, uma âncora pode
      # deixar de existir e o patch passa a ser um no-op silencioso. Aqui isso falha o CI.
      - name: As âncoras dos patches continuam a existir?
        run: |
          set -euo pipefail
          node tools/extract-kernel.cjs --node-modules .work/dsh-install/node_modules --out .work/f0/kernel --trim
          node tools/patch-android.cjs --tree .work/f0/kernel | tee /tmp/patch.log
          if grep -q "AVISO" /tmp/patch.log; then
            echo "::error::um patch deixou de encontrar a sua âncora — a versão do kernel mudou"
            exit 1
          fi
          grep -q "guarda de caminhos instalada" /tmp/patch.log

  scripts:
    name: sintaxe dos scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: bash -n em todos os scripts
        run: |
          set -e
          for f in tools/*.sh daemon/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: node --check nos ficheiros JS
        run: |
          set -e
          for f in tools/*.mjs tools/*.cjs daemon/*.cjs; do
            echo "node --check $f"
            node --check "$f"
          done

  apk:
    name: APK de debug a partir de um clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Sem `android-actions/setup-android`: a v3 pede o pacote legacy "tools" (que já não
      # existe no repositório) e falha. A imagem do runner já traz o SDK — só falta a
      # plataforma que a app declara (compileSdk 35) e as build-tools.
      - name: Plataforma Android 35 e build-tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Ferramentas do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip python3 >/dev/null

      # Este passo é a promessa do bootstrap: o runtime Node arm64/bionic vem dos pacotes do
      # Termux e as bibliotecas embutidas saem do fecho de DT_NEEDED. Nada disto existe num
      # clone — se falhar aqui, falha para qualquer pessoa.
      - name: Runtime arm64 (Termux) e bibliotecas embutidas
        run: |
          ./tools/fetch-runtime.sh
          ./tools/prepare-embed.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar a APK de debug
        working-directory: app
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.work/gradle-home
          ANDROID_USER_HOME: ${{ github.workspace }}/.work/android-home
        run: gradle --no-daemon --console=plain assembleDebug

      # Testes de interface na JVM (Robolectric): a app compõe-se a sério, com dados inventados,
      # em pt-PT e em inglês — sem emulador e sem toques de ecrã. No aparelho isto não corre (o
      # Espresso usa APIs que as ROMs recentes escondem — ver knowledge 114).
      - name: Testes de interface (JVM, pt-PT + inglês)
        working-directory: app
        run: gradle --no-daemon --console=plain testDebugUnitTest

      - name: Guardar a APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cachalote-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
