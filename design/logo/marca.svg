  <path d="M 28 69 C 23 64, 21 52, 28 42 C 32 37, 43 36, 54 44 L 66 53 L 76 43 C 78 41, 81 42, 80 46 L 77 56 L 82 62 C 84 64, 82 67, 78 66 L 67 63 L 53 59 C 42 56, 36 60, 33 66 Z" fill="currentColor"/>
