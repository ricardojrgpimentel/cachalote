org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# A compilação Kotlin corre **no processo do Gradle** (`in-process`), e não num daemon à parte.
# O daemon do Kotlin escreve um ficheiro de sincronização em `~/Library/Application Support/kotlin`,
# que fica fora do ambiente deste projecto (o harness recusa a escrita lá) e o build cuspiu
# `Daemon compilation failed: Could not connect to Kotlin compile daemon` em todas as compilações —
# mensagem que parece um erro e não é. Em processo, o build é mais lento por compilação, mas
# determinístico e sem esse aviso (`STATUS` §84).
kotlin.compiler.execution.strategy=in-process
